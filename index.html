<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="LifeOS — Twój system planowania życia i rozwoju osobistego. Odkryj swoje powołanie, planuj cele i realizuj zadania." />
  <meta name="theme-color" content="#0a0a0f" />
  <title>LifeOS — System Planowania i Rozwoju</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>

</head>
<body>
  <div id="app">
    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="logo-icon">
            <i data-lucide="orbit" class="logo-svg"></i>
          </div>
          <span class="logo-text">LifeOS</span>
        </div>
        <button id="sidebar-close" class="sidebar-close" aria-label="Zamknij menu">
          <i data-lucide="x"></i>
        </button>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Filled by sidebar.js -->
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-version">v1.0 — Faza 1</div>
      </div>
    </aside>

    <!-- Mobile Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Main Content -->
    <main id="main-content" class="main-content">
      <!-- Top Bar -->
      <header class="topbar">
        <button id="menu-toggle" class="menu-toggle" aria-label="Otwórz menu">
          <i data-lucide="menu"></i>
        </button>
        <div class="topbar-title" id="topbar-title">Dashboard</div>
        <div class="topbar-actions" style="display:flex;gap:var(--space-2);align-items:center;">
          <button id="cloud-sync-btn" class="btn btn-ghost btn-sm" title="Synchronizuj dane w chmurze bez przesyłania plików" aria-label="Synchronizacja chmury">
            <i data-lucide="cloud"></i>
            <span class="btn-label">Chmura</span>
          </button>
          <button id="export-btn" class="btn btn-ghost btn-sm" title="Pobierz kopię zapasową (JSON)" aria-label="Eksportuj dane">
            <i data-lucide="download"></i>
            <span class="btn-label">Kopia JSON</span>
          </button>
          <button id="import-btn" class="btn btn-ghost btn-sm" title="Wczytaj kopię z pliku JSON" aria-label="Importuj dane">
            <i data-lucide="upload"></i>
            <span class="btn-label">Wczytaj</span>
          </button>
          <input type="file" id="import-file-input" accept=".json" style="display:none;" />
          <button id="quick-add-btn" class="btn btn-primary btn-sm" aria-label="Dodaj zadanie">
            <i data-lucide="plus"></i>
            <span class="btn-label">Nowe zadanie</span>
          </button>
        </div>
      </header>

      <!-- View Container -->
      <div id="view-container" class="view-container">
        <!-- Views are rendered here by the router -->
      </div>
    </main>
  </div>

  <!-- Quick Add Task Modal -->
  <dialog id="quick-add-modal" class="modal">
    <div class="modal-content glass-card">
      <div class="modal-header">
        <h2>Nowe zadanie</h2>
        <button class="modal-close" aria-label="Zamknij">
          <i data-lucide="x"></i>
        </button>
      </div>
      <form id="quick-add-form" class="modal-body">
        <div class="form-group">
          <label for="task-title-input">Tytuł zadania</label>
          <input type="text" id="task-title-input" class="form-control" placeholder="Co chcesz zrobić?" required />
        </div>
        <div class="form-group">
          <label for="task-quadrant-input">Kwadrant Eisenhowera</label>
          <select id="task-quadrant-input" class="form-control">
            <option value="1">Q1 — Ważne i Pilne</option>
            <option value="2" selected>Q2 — Ważne i Niepilne</option>
            <option value="3">Q3 — Nieważne i Pilne</option>
            <option value="4">Q4 — Nieważne i Niepilne</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="task-due-input">Termin</label>
            <input type="date" id="task-due-input" class="form-control" />
          </div>
          <div class="form-group">
            <label for="task-pomodoros-input">Pomodoro (est.)</label>
            <input type="number" id="task-pomodoros-input" class="form-control" min="1" max="20" value="1" />
          </div>
        </div>
        <div class="form-group">
          <label for="task-goal-input">Powiązany cel</label>
          <select id="task-goal-input" class="form-control">
            <option value="">— Brak —</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" onclick="document.getElementById('quick-add-modal').close()">Anuluj</button>
          <button type="submit" class="btn btn-primary">Dodaj zadanie</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- Cloud Sync Modal -->
  <dialog id="cloud-sync-modal" class="modal">
    <div class="modal-content glass-card">
      <div class="modal-header">
        <h2 style="display:flex;align-items:center;gap:0.5rem;"><i data-lucide="cloud"></i> Synchronizacja w chmurze</h2>
        <button class="modal-close" aria-label="Zamknij" onclick="document.getElementById('cloud-sync-modal').close()">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:1rem;">
        <p style="font-size:0.9rem;opacity:0.8;margin:0;">
          Użyj tego samego <strong>Kodu Chmury</strong> na komputerze i telefonie, aby przesyłać swoje dane bez ręcznych plików!
        </p>

        <div class="form-group">
          <label for="cloud-sync-key-input">Twój Kod Chmury (Sync ID)</label>
          <div style="display:flex;gap:0.5rem;">
            <input type="text" id="cloud-sync-key-input" class="form-control" placeholder="np. lech2026" style="flex:1;" />
            <button type="button" id="cloud-gen-key-btn" class="btn btn-ghost" title="Wygeneruj losowy kod">
              <i data-lucide="sparkles"></i>
            </button>
          </div>
          <small style="opacity:0.6;display:block;margin-top:0.25rem;">Wpisz własne słowo lub kliknij różdżkę. Użyj tego samego kodu na innych urządzeniach.</small>
        </div>

        <div id="cloud-sync-status" class="badge badge-info" style="display:none;padding:0.5rem;text-align:center;"></div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-top:0.5rem;">
          <button type="button" id="cloud-save-btn" class="btn btn-primary" style="display:flex;justify-content:center;align-items:center;gap:0.5rem;">
            <i data-lucide="cloud-upload"></i> Wyślij do chmury
          </button>
          <button type="button" id="cloud-load-btn" class="btn btn-ghost" style="border:1px solid var(--glass-border);display:flex;justify-content:center;align-items:center;gap:0.5rem;">
            <i data-lucide="cloud-download"></i> Pobierz z chmury
          </button>
        </div>
      </div>
    </div>
  </dialog>

  <!-- App Entry Point -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
